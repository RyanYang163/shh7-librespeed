#
# Least privilege: no privileged mode, no host network, capabilities reduced
# to an explicit allow-list. See README.md §权限与最小化 and PRIVACY.md §4.
# ============================================================================
services:
  shh7-librespeed:
    image: linuxserver/librespeed:6.3.0
    container_name: shh7-librespeed
    restart: unless-stopped
    ports:
      - "18807:80"
    volumes:
      - /Volume*/DockerAppData/shh7-librespeed/data:/config
      - /Volume*/DockerAppData/shh7-librespeed/www:/config/www
    environment:
      - TZ=Asia/Shanghai
      # The image's s6 init drops privileges to this UID/GID, so the nginx and
      # php-fpm worker processes run as uid 1000 rather than root.
      - PUID=1000
      - PGID=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Allow-list: Docker's default set minus NET_RAW / SETPCAP / SETFCAP,
      # none of which this application needs.
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

x-app-meta:
  web:
    port: 18807
    protocol: http
